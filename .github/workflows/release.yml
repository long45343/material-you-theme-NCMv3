name: Build & Release Plugin

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Resolve Version & Package Plugin
        id: package
        run: |
          # 提取版本号：如果是 tag 触发则使用 tag，否则从 src/manifest.json 中读取
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./src/manifest.json').version")
          fi
          
          PLUGIN_NAME="MaterialU-ncmv3-${VERSION}.plugin"
          echo "Building plugin package: ${PLUGIN_NAME}"
          
          python3 -c "
          import os, zipfile
          dist = 'dist'
          output = '${PLUGIN_NAME}'
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(dist):
                  for file in files:
                      p = os.path.join(root, file)
                      arcname = os.path.relpath(p, dist)
                      z.write(p, arcname)
          print(f'Successfully created {output}')
          "
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "plugin_file=${PLUGIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.plugin_file }}
          path: ${{ steps.package.outputs.plugin_file }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package.outputs.version }}
          files: ${{ steps.package.outputs.plugin_file }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.package.outputs.version, 'alpha') || contains(steps.package.outputs.version, 'beta') || contains(steps.package.outputs.version, 'rc') }}
